name: Assemble usque source

on:
  workflow_dispatch:

concurrency:
  group: assemble-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load pins
        run: cat ci/pins.env | grep -E '^[A-Z]' >> "$GITHUB_ENV"

      - name: Assemble source tree
        run: |
          set -eux
          OUT="usque-${USQUE_VERSION}"
          rm -rf "$OUT"; mkdir -p "$OUT"

          git clone --filter=blob:none --no-checkout https://github.com/Diniboy1123/usque "$OUT"
          git -C "$OUT" checkout "$USQUE_COMMIT"

          # Reproducible tarball: pin mtimes to the upstream commit date
          # (USQUE_VERSION is a semver tag, not a date like dae/daed).
          SOURCE_DATE_EPOCH=$(git -C "$OUT" log -1 --format=%ct)
          export SOURCE_DATE_EPOCH

          find "$OUT" -name .git -type d -prune -exec rm -rf {} +

          # Unique id from the tarball content: identical input reproduces the same
          # name (idempotent), different content gets a different name - so a
          # re-assemble never clobbers an older tarball that Makefile hashes pin.
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --numeric-owner --owner=0 --group=0 -cf src.tmp.tar "$OUT"
          gzip -n -9 src.tmp.tar
          SRC_ID=$(sha256sum src.tmp.tar.gz | cut -c1-12)
          TARBALL="usque-src-${USQUE_VERSION}-${SRC_ID}.tar.gz"
          mv src.tmp.tar.gz "$TARBALL"
          echo "PKG_HASH=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to usque-src release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view usque-src --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create usque-src --repo "${{ github.repository }}" \
              --title "usque pinned source" --notes "Auto-assembled immutable content-addressed usque source assets; existing assets are never overwritten or automatically deleted." --latest=false
          sh scripts/upload-source-asset.sh usque-src "$TARBALL" "${{ github.repository }}"

      - name: Write PKG_HASH into Makefile and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cur_ver=$(sed -n 's/^PKG_VERSION:=//p' usque/Makefile)
          cur_rel=$(sed -n 's/^PKG_RELEASE:=//p' usque/Makefile)
          if [ "$cur_ver" = "${USQUE_VERSION}" ] && grep -qx "PKG_SOURCE:=${TARBALL}" usque/Makefile; then
            echo "no change"; exit 0
          fi
          if [ "$cur_ver" = "${USQUE_VERSION}" ]; then
            rel=$((cur_rel + 1))
          else
            rel=1
          fi
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${USQUE_VERSION}/" usque/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${rel}/" usque/Makefile
          sed -i "s|^PKG_SOURCE:=.*|PKG_SOURCE:=${TARBALL}|" usque/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${PKG_HASH}/" usque/Makefile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usque/Makefile
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(usque): assemble pinned source ${USQUE_VERSION}-${rel}"
          git push origin "HEAD:${{ github.ref_name }}"
